<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Productivity Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --text-primary: #1a1a1a;
      --text-secondary: #555;
      --text-muted: #999;
      --border: #e0e0e0;
      --border-strong: #bbb;
      --border-accent: #3b82f6;
      --border-success: #22c55e;
      --surface-1: #f5f5f5;
      --fill-accent: #3b82f6;
      --fill-success: #22c55e;
      --on-accent: #fff;
      --radius: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f0f0f0;
        --text-secondary: #aaa;
        --text-muted: #666;
        --border: #333;
        --border-strong: #555;
        --surface-1: #222;
        background: #141414;
      }
      body { background: #141414; }
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .planner {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    @media (prefers-color-scheme: dark) {
      .planner { background: #1e1e1e; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    }

    .date-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .date-label {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .date-input {
      border: none;
      border-bottom: 1.5px solid var(--border-strong);
      background: transparent;
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
      padding: 2px 4px;
      outline: none;
      font-family: var(--font-sans);
    }

    .date-input:focus { border-bottom-color: var(--border-accent); }

    .col-labels {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 0 4px;
      align-items: center;
    }

    .col-label {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.04em;
    }

    .col-label.sessions-lbl { width: 113px; }
    .col-label.actual-lbl { width: 52px; }
    .col-label.done-lbl { width: 24px; }

    .section-block { margin-bottom: 1.5rem; }

    .section-title {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #2563eb;
      margin: 0 0 2px;
    }

    .section-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 12px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }

    .task-row:last-child { border-bottom: none; }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .task-num {
      font-size: 13px;
      color: var(--text-muted);
      min-width: 16px;
    }

    .task-input {
      border: none;
      background: transparent;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      flex: 1;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      width: 260px;
      font-family: var(--font-sans);
      transition: color 0.2s;
    }

    .task-input:focus { border-bottom-color: var(--border-accent); }
    .task-input.done { color: var(--text-muted); text-decoration: line-through; }

    .task-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .session-bar {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .seg {
      width: 22px;
      height: 14px;
      border-radius: 3px;
      border: 1.5px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      padding: 0;
    }

    .seg.on { border-color: transparent; }
    .seg[data-lvl="1"].on { background: #93c5fd; }
    .seg[data-lvl="2"].on { background: #60a5fa; }
    .seg[data-lvl="3"].on { background: #3b82f6; }
    .seg[data-lvl="4"].on { background: #2563eb; }
    .seg[data-lvl="5"].on { background: #1d4ed8; }

    .actual-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .actual-input {
      width: 36px;
      border: none;
      border-bottom: 1.5px solid var(--border-strong);
      background: transparent;
      font-size: 13px;
      color: var(--text-primary);
      text-align: center;
      outline: none;
      padding: 2px 0;
      font-family: var(--font-sans);
    }

    .actual-input:focus { border-bottom-color: var(--border-accent); }

    .actual-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .tick-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .tick-btn:hover { border-color: var(--border-success); }
    .tick-btn.done { background: var(--fill-success); border-color: var(--fill-success); }
    .tick-btn .checkmark { display: none; }
    .tick-btn.done .checkmark { display: block; }

    .divider {
      border: none;
      border-top: 0.5px solid var(--border);
      margin: 1.5rem 0;
    }

    .notes-block { margin-bottom: 1.5rem; }

    .notes-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .notes-area {
      width: 100%;
      border: none;
      border-bottom: 0.5px solid var(--border);
      background: transparent;
      font-size: 13px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      resize: none;
      outline: none;
      line-height: 2;
      padding: 0;
      min-height: 96px;
    }

    .notes-area:focus { border-bottom-color: var(--border-accent); }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 0.5px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .mood-wrap, .rating-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mood-label, .rating-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-right: 4px;
    }

    .mood-btn {
      font-size: 18px;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.12s, transform 0.12s;
      border: none;
      background: none;
      padding: 2px;
      line-height: 1;
    }

    .mood-btn:hover { opacity: 0.7; }
    .mood-btn.selected { opacity: 1; transform: scale(1.2); }

    .rating-btn {
      width: 28px;
      height: 28px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      background: transparent;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      font-family: var(--font-sans);
    }

    .rating-btn:hover { background: var(--surface-1); }

    .rating-btn.selected {
      background: var(--fill-accent);
      color: var(--on-accent);
      border-color: var(--fill-accent);
    }

    .save-btn {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      padding: 10px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.12s;
      font-family: var(--font-sans);
    }

    .save-btn:hover { background: var(--surface-1); }

    @media (max-width: 520px) {
      .planner { padding: 1.25rem; }
      .task-input { width: 140px; }
      .footer-row { flex-direction: column; align-items: flex-start; }
    }

    .btn-row { display: none; }

    .task-input { width: 100%; }

    @media print {
      @page {
        size: A4;
        margin: 20mm 18mm;
      }

      body {
        padding: 0;
        background: #fff !important;
        color: #1a1a1a !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .planner {
        max-width: 100%;
        box-shadow: none;
        border-radius: 0;
        padding: 0;
        background: #fff !important;
      }

      .save-btn { display: none; }

      .task-input { width: 100%; }

      .seg.on { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

      .tick-btn.done {
        background: #22c55e !important;
        border-color: #22c55e !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .tick-btn.done .checkmark { display: block !important; }

      .section-title { color: #2563eb !important; }

      textarea { border: none; resize: none; }
    }
  </style>
</head>
<body>
  <div class="planner">
    <div class="date-bar">
      <span class="date-label">Date</span>
      <input class="date-input" type="date" id="dateInput" />
    </div>

    <div class="col-labels">
      <span class="col-label sessions-lbl">Estimated time</span>
      <span class="col-label actual-lbl">Actual (h)</span>
      <span class="col-label done-lbl"></span>
    </div>

    <div class="section-block">
      <p class="section-title">Most important task of the day</p>
      <p class="section-sub">If this was the only thing you did today, you'd be satisfied.</p>
      <div id="mit-tasks"></div>
    </div>

    <div class="section-block">
      <p class="section-title">Secondary tasks</p>
      <p class="section-sub">Completion of these tasks will make the day even better.</p>
      <div id="secondary-tasks"></div>
    </div>

    <div class="section-block">
      <p class="section-title">Additional tasks</p>
      <p class="section-sub">Do these only after completing the tasks above.</p>
      <div id="additional-tasks"></div>
    </div>

    <hr class="divider">

    <div class="notes-block">
      <div class="notes-label">Notes</div>
      <textarea class="notes-area" placeholder="Reflections, ideas, blockers…" rows="5"></textarea>
    </div>

    <div class="footer-row">
      <div class="mood-wrap">
        <span class="mood-label">Mood</span>
        <button class="mood-btn" title="Awful">😞</button>
        <button class="mood-btn" title="Bad">😕</button>
        <button class="mood-btn" title="Okay">😐</button>
        <button class="mood-btn" title="Good">🙂</button>
        <button class="mood-btn" title="Great">😄</button>
      </div>
      <div class="rating-wrap">
        <span class="rating-label">Rate your day</span>
        <button class="rating-btn">1</button>
        <button class="rating-btn">2</button>
        <button class="rating-btn">3</button>
        <button class="rating-btn">4</button>
        <button class="rating-btn">5</button>
      </div>
    </div>

    <button class="save-btn" onclick="savePDF()">Save planner</button>
  </div>

  <script>
    const taskConfigs = [
      { container: 'mit-tasks', nums: [1] },
      { container: 'secondary-tasks', nums: [2, 3] },
      { container: 'additional-tasks', nums: [4, 5] },
    ];

    function makeTaskRow(num) {
      const row = document.createElement('div');
      row.className = 'task-row';

      const left = document.createElement('div');
      left.className = 'task-left';
      const taskInput = document.createElement('input');
      taskInput.className = 'task-input';
      taskInput.type = 'text';
      taskInput.placeholder = 'Enter task…';
      taskInput.setAttribute('aria-label', 'Task ' + num);
      const numSpan = document.createElement('span');
      numSpan.className = 'task-num';
      numSpan.textContent = num + '.';
      left.append(numSpan, taskInput);

      const controls = document.createElement('div');
      controls.className = 'task-controls';

      const bar = document.createElement('div');
      bar.className = 'session-bar';
      bar.setAttribute('role', 'group');
      bar.setAttribute('aria-label', 'Estimated time for task ' + num);
      let level = 0;
      for (let i = 1; i <= 5; i++) {
        const seg = document.createElement('button');
        seg.className = 'seg';
        seg.dataset.lvl = i;
        seg.setAttribute('aria-label', (i * 30) + ' minutes');
        seg.addEventListener('click', () => {
          level = (level === i) ? 0 : i;
          bar.querySelectorAll('.seg').forEach(s => {
            s.classList.toggle('on', parseInt(s.dataset.lvl) <= level);
          });
        });
        bar.appendChild(seg);
      }

      const actualWrap = document.createElement('div');
      actualWrap.className = 'actual-wrap';
      actualWrap.innerHTML = '<input class="actual-input" type="number" min="0" max="24" step="0.5" placeholder="—" aria-label="Actual hours for task ' + num + '"><span class="actual-label">h</span>';

      const tick = document.createElement('button');
      tick.className = 'tick-btn';
      tick.setAttribute('aria-label', 'Mark task ' + num + ' complete');
      tick.innerHTML = '<svg class="checkmark" width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      tick.addEventListener('click', () => {
        const isDone = tick.classList.toggle('done');
        taskInput.classList.toggle('done', isDone);
        tick.setAttribute('aria-label', isDone ? 'Mark task ' + num + ' incomplete' : 'Mark task ' + num + ' complete');
      });

      controls.append(bar, actualWrap, tick);
      row.append(left, controls);
      return row;
    }

    taskConfigs.forEach(cfg => {
      const container = document.getElementById(cfg.container);
      cfg.nums.forEach(n => container.appendChild(makeTaskRow(n)));
    });

    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

    function savePDF() {
      const date = document.getElementById('dateInput').value;
      const formatted = date ? new Date(date + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'planner';
      document.title = 'Productivity Planner 2014 ' + formatted;
      window.print();
      document.title = 'Daily Productivity Planner';
    }

    document.querySelectorAll('.mood-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    document.querySelectorAll('.rating-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  </script>
</body>
</html>
